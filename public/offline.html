<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · BookmarkAI</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --surface: #ffffff;
        --fg: #1a1a18;
        --muted: #6b6b66;
        --border: #e5e5e0;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171a;
          --surface: #202024;
          --fg: #ededf0;
          --muted: #a3a3b0;
          --border: #34343c;
          --accent: #818cf8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .icon { font-size: 40px; line-height: 1; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      button, a {
        display: block;
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
      }
      button { border: 0; background: var(--accent); color: #fff; }
      a { margin-top: 8px; color: var(--fg); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>
        This page isn't saved on this device yet. Bookmarks and todos you've
        opened before still work offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/bookmarks">Open saved bookmarks</a>
    </main>
    <script>
      // Reload by itself as soon as the connection is back.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
