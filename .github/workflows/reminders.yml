name: Reminders

# Every 5 minutes, asks production to push notifications for todos that are
# due or back from snooze (app/api/cron/reminders/route.ts). GitHub may start
# scheduled runs late under load, so a reminder can arrive a few minutes after
# its time. Skips quietly until the CRON_SECRET repo secret is set.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai-bookmarker.vercel.app/api/cron/reminders
