name: Deploy to Vercel

# Called by CI when a major or minor version bump lands on main, or run by hand from the Actions tab.
# Each stage is its own job, so the run graph shows exactly how far a deploy got:
#   1 Verify → 2 Migrate database → 3 Deploy to Vercel → 4 Smoke test → 5 Tag release
# When called from CI, CI sends the single Telegram message at the end (from this workflow's
# outputs). A manual run notifies from here instead.
on:
  workflow_call:
    inputs:
      skip_verify:
        description: Skip lint + build (the caller already verified this commit)
        type: boolean
        default: false
    outputs:
      verified:
        value: ${{ jobs.verify.outputs.ok }}
      migrated:
        value: ${{ jobs.migrate.outputs.ok }}
      migrations:
        value: ${{ jobs.migrate.outputs.applied }}
      deployed:
        value: ${{ jobs.vercel.outputs.ok }}
      deployment_url:
        value: ${{ jobs.vercel.outputs.url }}
      smoke_ok:
        value: ${{ jobs.smoke.outputs.ok }}
      released:
        value: ${{ jobs.release.outputs.ok }}
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of racing an older one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SITE_URL: https://ai-bookmarker.vercel.app

jobs:
  verify:
    name: 1 · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - if: ${{ !inputs.skip_verify }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: ${{ !inputs.skip_verify }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Lint and build
        if: ${{ !inputs.skip_verify }}
        run: |
          npm ci
          npm run lint
          npm run build

      - id: done
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.skip_verify }}" = "true" ]; then
            echo "Lint and build already passed in CI for this commit."
          fi

  # Applies only migrations not yet in _prisma_migrations; never resets or drops data.
  # Runs before the deploy, so the old code must tolerate the new schema for a minute.
  migrate:
    name: 2 · Migrate database
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ok: ${{ steps.migrate.outputs.ok }}
      applied: ${{ steps.migrate.outputs.applied }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: migrate
        name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          status=0
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/migrate.log" || status=$?
          # Recorded even on failure, so the notification can say what was attempted.
          applied=$(grep -oE 'Applying migration `[^`]+`' "$RUNNER_TEMP/migrate.log" | sed -E 's/.*`(.+)`/\1/' | paste -sd, - || true)
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          if [ -n "$applied" ]; then
            echo "### Migrations applied" >> "$GITHUB_STEP_SUMMARY"
            echo "$applied" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$status" -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT"
          exit $status

  # Vercel builds from source, so the Prisma engine matches its runtime.
  vercel:
    name: 3 · Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url || 'https://ai-bookmarker.vercel.app' }}
    outputs:
      ok: ${{ steps.vercel.outputs.ok }}
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vercel
        name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@65.9.0 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" --meta githubRef="$GITHUB_REF_NAME")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: 4 · Smoke test
    needs: vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.smoke.outputs.ok }}
    steps:
      - id: smoke
        run: |
          check() {
            got=$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null -w "%{http_code}" "$SITE_URL$1" || true)
            if [ "$got" != "$2" ]; then
              echo "::error::$SITE_URL$1 returned $got, expected $2"
              return 1
            fi
            echo "$SITE_URL$1 -> $got"
          }
          check /login 200
          check / 200
          check /bookmarks 307
          echo "ok=true" >> "$GITHUB_OUTPUT"

  # Tags the deployed commit vX.Y.Z and publishes a GitHub Release with generated notes.
  release:
    name: 5 · Tag release
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # release tag
    outputs:
      ok: ${{ steps.release.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "BookmarkAI $tag" --generate-notes
            echo "### Released $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  # Manual runs only; when called from CI, CI notifies once for the whole pipeline.
  notify:
    name: Notify
    needs: [verify, migrate, vercel, smoke, release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || (contains(needs.*.result, 'failure') && 'failure' || 'success') }}
          VERIFY_OUTCOME: ${{ needs.verify.result }}
          MIGRATE_OUTCOME: ${{ needs.migrate.result }}
          VERCEL_OUTCOME: ${{ needs.vercel.result }}
          SMOKE_OUTCOME: ${{ needs.smoke.result }}
          RELEASE_OUTCOME: ${{ needs.release.result }}
          MIGRATIONS: ${{ needs.migrate.outputs.applied }}
          DEPLOYMENT_URL: ${{ needs.vercel.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-telegram.mjs deploy
